[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kid-command-center"
version = "0.1.0"
description = "A parent's local, password-protected view of what is opened on a child's laptop, with blocks and daily time limits."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "comtypes>=1.4",      # UI Automation: reads the browser's address bar (no extension needed)
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5.0",     # the parent's app window
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
kcc = "kid_command_center.__main__:main"

[project.gui-scripts]
kcc-app = "kid_command_center.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kid_command_center = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E501"]
